name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - prod
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (all, release, debug)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Configure Keystore (if secrets provided)
        id: keystore-setup
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "Signing secret found. Setting up keystore..."
            mkdir -p app
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/release-key.jks
            echo "storeFile=release-key.jks" > keystore.properties
            echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> keystore.properties
            echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "No signing secret provided. Will build with default/debug keys."
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build APKs
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'all' }}"
          
          if [[ "$BUILD_TYPE" == "debug" ]]; then
            ./gradlew assembleStandaloneDebug -Pbeta=true -PgitHash=${{ github.sha }} --stacktrace
          elif [[ "$BUILD_TYPE" == "release" ]]; then
            ./gradlew assembleStandaloneRelease -Pbeta=false -PgitHash=${{ github.sha }} --stacktrace
          else
            ./gradlew assembleStandaloneDebug assembleStandaloneRelease -Pbeta=true -PgitHash=${{ github.sha }} --stacktrace
          fi

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output-apks
          
          # Find all generated APKs and copy with readable names
          find app/build/outputs/apk -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            echo "Found APK: $apk"
            cp "$apk" "output-apks/$filename"
          done
          
          ls -la output-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UmihiMusic-APKs
          path: output-apks/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'output-apks/*.apk'
          draft: false
          prerelease: false
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
